<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SEO & Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Calendar | TimerMode</title>
    <meta name="description" content="A Memento Mori chart visualizing your life in weeks. See your past, present, and future in a minimalist 90-year grid.">
    <meta name="keywords" content="Life calendar, Memento mori chart, Weeks of my life, mortality visualization, stoic tools">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --grid-gap: 3px;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- Header & Controls --- */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .control-panel {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .date-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
        }

        .stats-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
        }

        /* --- The Life Grid --- */
        .grid-container {
            display: grid;
            /* 52 weeks per row */
            grid-template-columns: repeat(52, 1fr); 
            gap: var(--grid-gap);
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
        }

        .week-box {
            aspect-ratio: 1;
            border-radius: 1px;
            background-color: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            position: relative;
        }

        /* States */
        .week-box.past {
            background-color: #334155; /* Slate 700 */
        }

        .week-box.current {
            background-color: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            z-index: 2;
            transform: scale(1.5);
            border-radius: 2px;
            animation: pulse 2s infinite;
        }

        .week-box.future {
            /* Empty */
        }
        
        /* Decade Markers (Optional visual aid) */
        .week-box:nth-child(520n) { /* Every 10 years */
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        /* Hover Effect */
        .week-box:hover {
            transform: scale(2);
            z-index: 10;
            background-color: white;
        }
        
        .week-box:hover::after {
            content: attr(data-age);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid var(--border-color);
        }

        /* --- Footer / Legend --- */
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 2px; }

        .back-link {
            margin-top: 40px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .back-link:hover { color: white; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .grid-container { gap: 1px; padding: 10px; }
            .brand-title { font-size: 1.5rem; }
            /* On very small screens, 52 cols is tight, but we keep it for the "Life" metaphor */
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="brand-title">Memento Mori</h1>
        <p class="subtitle">
            Each square represents one week of your life.<br>
            You have <strong>90 years</strong> (4,680 weeks) on this grid.
        </p>

        <div class="control-panel">
            <div style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
                <label style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px;">Your Birthday</label>
                <input type="date" id="birth-date" class="date-input">
            </div>
            <div id="stats-area" style="display:none; gap:10px; flex-wrap:wrap;">
                <div class="stats-badge">Lived: <span id="lived-pct">0%</span></div>
                <div class="stats-badge" style="color:var(--text-secondary);">Left: <span id="weeks-left">0</span> wks</div>
            </div>
        </div>
    </div>

    <!-- The 90x52 Grid -->
    <div id="life-grid" class="grid-container"></div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#334155"></div> Past</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-blue); box-shadow:0 0 5px var(--accent-blue);"></div> Present</div>
        <div class="legend-item"><div class="dot" style="background:rgba(255,255,255,0.1)"></div> Future</div>
    </div>

    <a href="index.html" class="back-link">← Back to Dashboard</a>

    <script>
        const TOTAL_YEARS = 90;
        const WEEKS_PER_YEAR = 52;
        const TOTAL_WEEKS = TOTAL_YEARS * WEEKS_PER_YEAR;
        
        // Default to a generic date if not set
        const defaultDate = '2000-01-01';

        document.addEventListener('DOMContentLoaded', () => {
            const savedDob = localStorage.getItem('fs_dob');
            const dateInput = document.getElementById('birth-date');
            
            if (savedDob) {
                dateInput.value = savedDob;
                renderGrid(new Date(savedDob));
            } else {
                // Render empty or demo grid
                renderGrid(new Date(defaultDate));
            }

            dateInput.addEventListener('change', (e) => {
                const dob = new Date(e.target.value);
                localStorage.setItem('fs_dob', e.target.value);
                renderGrid(dob);
            });
        });

        function renderGrid(dob) {
            const grid = document.getElementById('life-grid');
            grid.innerHTML = ''; // Clear existing

            const now = new Date();
            // Calculate weeks lived
            const diffTime = Math.abs(now - dob);
            const weeksLived = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            
            // Update Stats
            const percent = ((weeksLived / TOTAL_WEEKS) * 100).toFixed(1);
            document.getElementById('lived-pct').innerText = percent + '%';
            document.getElementById('weeks-left').innerText = (TOTAL_WEEKS - weeksLived).toLocaleString();
            document.getElementById('stats-area').style.display = 'flex';

            // Fragment for performance
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < TOTAL_WEEKS; i++) {
                const div = document.createElement('div');
                div.classList.add('week-box');

                // Calculate age for this box
                const ageYear = Math.floor(i / 52);
                div.setAttribute('data-age', `Age: ${ageYear}`);

                if (i < weeksLived) {
                    div.classList.add('past');
                } else if (i === weeksLived) {
                    div.classList.add('current');
                    div.setAttribute('title', 'This Week');
                } else {
                    div.classList.add('future');
                }

                fragment.appendChild(div);
            }

            grid.appendChild(fragment);
        }
    </script>
</body>
</html>
